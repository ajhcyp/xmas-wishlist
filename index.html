<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Anthony · Wish List · Xmas 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,800;1,900&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #f4f7fb; --muted: #a9b6c8; --accent: #c8e0ff; --bg: #1b2535; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Jost", "Futura", "Century Gothic", sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .title { position: fixed; top: clamp(28px, 7vh, 80px); left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
  .title .kicker, .title .sub { font-weight: 400; letter-spacing: .42em; text-transform: uppercase; color: var(--ink); opacity: .92; }
  .title .kicker { font-size: clamp(14px, 2vw, 22px); font-style: italic; font-weight: 300; padding-left: .42em; }
  .title h1 { font-style: italic; font-weight: 900; font-size: clamp(48px, 9vw, 112px); line-height: .95; letter-spacing: -.01em; margin: .08em 0 .12em; text-shadow: 0 6px 40px rgba(0,0,0,.35); }
  .title .sub { font-size: clamp(13px, 1.7vw, 20px); padding-left: .42em; }
  .crumb { display: inline-flex; gap: .6em; align-items: center; }
  .crumb i { font-style: normal; opacity: .5; letter-spacing: 0; }

  .info { position: fixed; left: 0; right: 0; bottom: clamp(18px, 4vh, 44px); z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 0 20px; }
  .info .idx { font-size: 12px; letter-spacing: .4em; color: var(--muted); padding-left: .4em; }
  .info h2 { font-weight: 500; font-size: clamp(18px, 2.4vw, 26px); letter-spacing: .28em; text-transform: uppercase; padding-left: .28em; transition: opacity .3s, transform .3s; }
  .info p { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); max-width: 560px; line-height: 1.6; transition: opacity .3s; }
  .info.swap h2, .info.swap p { opacity: 0; transform: translateY(6px); }
  .row { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .btn { appearance: none; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.06); color: var(--ink); font: inherit; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; padding: 12px 20px 12px 24px; border-radius: 999px; cursor: pointer; text-decoration: none; backdrop-filter: blur(6px); transition: background .2s, border-color .2s, transform .2s; }
  .btn:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.7); transform: translateY(-1px); }
  .btn.primary { background: var(--ink); color: #142033; border-color: var(--ink); font-weight: 500; }
  .btn.primary:hover { background: #fff; }
  .arrow { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; letter-spacing: 0; font-size: 18px; }
  .dots { display: flex; gap: 8px; }
  .dots button { width: 7px; height: 7px; border-radius: 50%; border: 0; background: rgba(255,255,255,.3); cursor: pointer; transition: all .3s; padding: 0; }
  .dots button.on { background: var(--ink); width: 22px; border-radius: 4px; }

  .loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: var(--bg); color: var(--muted); letter-spacing: .4em; font-size: 12px; transition: opacity .6s; }
  .loader.gone { opacity: 0; pointer-events: none; }

  .ship { position: fixed; left: clamp(16px, 3vw, 44px); top: 50%; transform: translateY(-50%); z-index: 3; width: 250px; padding: 22px 22px 18px; border-radius: 18px; background: rgba(16, 24, 38, .55); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .ship .lbl { font-size: 11px; letter-spacing: .38em; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .ship .lbl::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.18); }
  .ship address { font-style: normal; font-size: 15px; line-height: 1.65; letter-spacing: .04em; color: var(--ink); }
  .ship address .city { color: var(--muted); }
  .ship .tel { display: inline-block; margin-top: 10px; color: var(--accent); text-decoration: none; font-size: 14px; letter-spacing: .08em; }
  .ship .tel:hover { text-decoration: underline; }
  .ship .copy { margin-top: 16px; width: 100%; padding: 10px 14px; font-size: 11px; }
  .ship-toggle { display: none; }
  @media (max-width: 900px) {
    .ship { top: auto; bottom: auto; transform: none; top: 14px; left: 14px; width: auto; padding: 0; background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .ship .body { display: none; margin-top: 8px; width: 240px; padding: 18px; border-radius: 16px; background: rgba(16, 24, 38, .88); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .ship.open .body { display: block; }
    .ship-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 10px; }
  }

  @media (max-width: 600px) {
    .info p { font-size: 11px; letter-spacing: .14em; }
    .title .kicker, .title .sub { letter-spacing: .28em; }
  }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="stage"></div>

<header class="title">
  <div class="kicker">Anthony</div>
  <h1>WISH LIST</h1>
  <div class="sub">Xmas 2026</div>
</header>

<aside class="ship" id="ship">
  <button class="btn ship-toggle" id="shipToggle" aria-expanded="false">&#128230; Send to</button>
  <div class="body">
    <div class="lbl">SEND TO</div>
    <address id="addr">Viale Monte Grappa, 3/5<br><span class="city">Milano, MI 20124<br>Italia</span></address>
    <a class="tel" href="tel:+393513858606">+39 351 385 8606</a>
    <button class="btn copy" id="copyAddr">Copy address</button>
  </div>
</aside>

<section class="info" id="info">
  <div class="idx" id="idx">01 / 05</div>
  <h2 id="name">—</h2>
  <p id="desc">—</p>
  <div class="row">
    <button class="btn arrow" id="prev" aria-label="Previous">&#8592;</button>
    <a class="btn primary" id="link" href="#" target="_blank" rel="noopener">View on Amazon.it</a>

</section>

<div class="loader" id="loader">LOADING…</div>

<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { Reflector } from "three/addons/objects/Reflector.js";

try { await Promise.race([Promise.all(["italic 900 40px Jost","500 40px Jost","300 40px Jost","600 40px Jost"].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]); } catch {}

/* ================= EDIT YOUR WISH LIST HERE =================
   name / desc show at the bottom, url is the Amazon.it link.
   priority 1 = most wanted (tallest podium). model: headset | protein | watch | laptop | book | tablet | boardgame | underwear */
const PRODUCTS = [
  { priority: 1, model: "headset",   name: "JBL Tune 670 NC",               desc: "Wireless on-ear headphones, noise cancelling, black", url: "https://www.amazon.it/dp/B0C665WWTD" },
  { priority: 2, model: "watch",     name: "HUAWEI Band 11 Pro",            desc: "Smart watch and fitness tracker, black",               url: "https://www.amazon.it/dp/B0GGHRJR23" },
  { priority: 3, model: "protein",   name: "ESN Flexpresso Protein Coffee",  desc: "White Chocolate Mocca, 908 g",                        url: "https://www.amazon.it/dp/B0CL4WY8S1" },
  { priority: 4, model: "laptop",    name: "HP Victus Gaming Laptop",       desc: "15.6\" FHD 144 Hz, Core 5 210H, RTX 3050",            url: "https://www.amazon.it/dp/B0H2Z2WR5J" },
  { priority: 5, model: "book", cover: "book_mastery", spine: { bg: "#231c13", fg: "#c9a63a", title: "MASTERY", author: "ROBERT GREENE" }, thick: 0.17,
    name: "Mastery", desc: "Book by Robert Greene, paperback", url: "https://www.amazon.it/dp/178125091X" },
  { priority: 6, model: "book", cover: "book_peak", spine: { bg: "#f7f7f5", fg: "#1aa6e0", title: "PEAK", author: "ERICSSON  &  POOL" }, thick: 0.12,
    name: "Peak", desc: "Anders Ericsson & Robert Pool, paperback", url: "https://www.amazon.it/dp/0544947223" },
  { priority: 7, model: "boardgame", name: "Blood Rage",                    desc: "Board game, Asterion, Italian edition",               url: "https://www.amazon.it/dp/B017XZJUIW" },
  { priority: 8, model: "tablet",    name: "Samsung Galaxy Tab S11",        desc: "WiFi, 12 GB RAM, 128 GB",                             url: "https://www.amazon.it/dp/B0FKBXQRD9" },
  { priority: 9, model: "underwear", name: "Black Socks & Underwear",       desc: "Men's black socks and boxers, any brand",             url: "https://www.amazon.it/s?k=calzini+e+boxer+uomo+neri" },
].sort((a, b) => a.priority - b.priority);
/* ============================================================ */

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color("#1b2535");
scene.background = BG;
scene.fog = new THREE.Fog(BG, 14, 30);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
const LOOK = new THREE.Vector3(0, 1.05, 0);

/* ---------- studio: back wall, mirror floor, lights ---------- */
function gradientTex(stops, w = 4, h = 512, radial = false) {
  const c = document.createElement("canvas"); c.width = radial ? 512 : w; c.height = h;
  const g = c.getContext("2d");
  const gr = radial ? g.createRadialGradient(360, 150, 10, 300, 220, 420) : g.createLinearGradient(0, 0, 0, h);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, c.width, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 22),
  new THREE.MeshBasicMaterial({ map: gradientTex([[0, "#2a3850"], [0.35, "#5f7896"], [0.7, "#34445c"], [1, "#1b2535"]], 0, 512, true), fog: true })
);
wall.position.set(0, 9, -11);
scene.add(wall);

const mirror = new Reflector(new THREE.CircleGeometry(40, 64), {
  textureWidth: innerWidth * Math.min(devicePixelRatio, 2) * 0.6,
  textureHeight: innerHeight * Math.min(devicePixelRatio, 2) * 0.6,
  color: 0x8a98ab,
});
mirror.rotation.x = -Math.PI / 2;
mirror.position.y = -0.002;
scene.add(mirror);
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: "#1d2838", roughness: 0.55, metalness: 0.2, transparent: true, opacity: 0.82 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

scene.add(new THREE.HemisphereLight("#bcd2ff", "#0c1220", 0.55));
const key = new THREE.SpotLight("#e6efff", 260, 40, 0.55, 0.7, 1.6);
key.position.set(3, 12, 6);
key.target.position.set(0, 0, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight("#7fa6ff", 1.2);
rim.position.set(-6, 5, -6);
scene.add(rim);
const front = new THREE.DirectionalLight("#ffffff", 0.6);
front.position.set(0, 3, 10);
scene.add(front);

/* ---------- helpers ---------- */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.1, ...o });
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function shadows(obj) { obj.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return obj; }

/* ---------- product models ---------- */
const MODELS = {
  headset() {
    const g = new THREE.Group();
    const shell = mat("#16181d", { roughness: 0.35, metalness: 0.3 });
    const metal = mat("#c9ced6", { roughness: 0.2, metalness: 1 });
    const pad = mat("#2a2d33", { roughness: 0.9 });
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.055, 20, 64, Math.PI), shell);
    band.scale.set(1, 1.1, 1.6);
    const cushion = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.04, 16, 48, Math.PI * 0.6), pad);
    cushion.rotation.z = Math.PI * 0.2; cushion.position.y = -0.04; cushion.scale.set(1, 1.05, 2.2);
    g.add(band, cushion);
    for (const s of [-1, 1]) {
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.34, 0.06), metal);
      arm.position.set(s * 0.64, -0.12, 0);
      const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.18, 48), shell);
      cup.rotation.z = Math.PI / 2; cup.position.set(s * 0.6, -0.42, 0); cup.scale.set(1, 1, 1.25);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.012, 8, 48), metal);
      ring.rotation.y = Math.PI / 2; ring.position.set(s * 0.695, -0.42, 0); ring.scale.set(1, 1, 1.25);
      const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.1, 48), pad);
      ear.rotation.z = Math.PI / 2; ear.position.set(s * 0.47, -0.42, 0); ear.scale.set(1, 1, 1.25);
      g.add(arm, cup, ring, ear);
    }
    g.position.y = 0.78;
    return g;
  },
  protein() {
    const g = new THREE.Group();
    const label = canvasTex(1024, 512, (x, w, h) => {
      x.fillStyle = "#15110e"; x.fillRect(0, 0, w, h);
      x.fillStyle = "#8a5a3c"; x.fillRect(0, h * 0.62, w, h * 0.1);
      x.fillStyle = "#ffffff"; x.textAlign = "center";
      for (const cx of [w * 0.25, w * 0.75]) {
        x.font = "italic 900 110px Jost, Arial"; x.fillText("ESN", cx, h * 0.3);
        x.font = "600 46px Jost, Arial"; x.fillText("FLEXPRESSO", cx, h * 0.44);
        x.font = "400 30px Jost, Arial"; x.fillText("PROTEIN COFFEE", cx, h * 0.54);
        x.font = "500 26px Jost, Arial"; x.fillText("WHITE CHOC MOCCA · 908 G", cx, h * 0.69);
      }
    });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 1.0, 64, 1, true), new THREE.MeshStandardMaterial({ map: label, roughness: 0.35, metalness: 0.05 }));
    body.position.y = 0.5; body.rotation.y = -Math.PI / 2;
    const base = new THREE.Mesh(new THREE.CircleGeometry(0.46, 64), mat("#0e1014"));
    base.rotation.x = Math.PI / 2; base.position.y = 0.001;
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.49, 0.49, 0.2, 64), mat("#1b1714", { roughness: 0.3 }));
    lid.position.y = 1.08;
    const ridge = new THREE.Mesh(new THREE.TorusGeometry(0.49, 0.015, 8, 64), mat("#8a5a3c"));
    ridge.rotation.x = Math.PI / 2; ridge.position.y = 1.02;
    g.add(body, base, lid, ridge);
    return g;
  },
  watch() {
    const g = new THREE.Group();
    const strap = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.22, 64, 1, true), mat("#16181c", { roughness: 0.8, side: THREE.DoubleSide }));
    strap.rotation.z = Math.PI / 2; strap.scale.set(1, 1, 1.15);
    const caseM = mat("#2a2d33", { roughness: 0.25, metalness: 0.9 });
    const body = new THREE.Mesh(new RoundedBoxGeometry(0.34, 0.58, 0.13, 6, 0.07), caseM);
    body.position.z = 0.5;
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.27, 0.49), new THREE.MeshBasicMaterial({ map: canvasTex(270, 490, (x, w, h) => {
      x.fillStyle = "#000"; x.fillRect(0, 0, w, h);
      x.fillStyle = "#fff"; x.textAlign = "center"; x.font = "300 96px Jost, Arial"; x.fillText("10", w / 2, h * 0.27); x.fillText("09", w / 2, h * 0.47);
      x.font = "500 24px Jost, Arial"; x.fillStyle = "#9aa3ad"; x.fillText("THU 25 DEC", w / 2, h * 0.56);
      x.lineWidth = 12; x.lineCap = "round";
      [["#ff375f", 0.66], ["#a6ff00", 0.74], ["#18e6ff", 0.82]].forEach(([c, y], k) => { x.strokeStyle = c + "33"; x.beginPath(); x.moveTo(40, h * y); x.lineTo(w - 40, h * y); x.stroke(); x.strokeStyle = c; x.beginPath(); x.moveTo(40, h * y); x.lineTo(40 + (w - 80) * [0.8, 0.6, 0.45][k], h * y); x.stroke(); });
      x.font = "500 28px Jost, Arial"; x.fillStyle = "#ff375f"; x.fillText("♥ 72", w / 2, h * 0.94);
    }) }));
    screen.position.z = 0.585;
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.06, 24), caseM);
    crown.rotation.z = Math.PI / 2; crown.position.set(0.18, 0.08, 0.5);
    g.add(strap, body, screen, crown);
    g.position.y = 0.48;
    return g;
  },
  tablet() {
    const g = new THREE.Group();
    const t = new THREE.Group();
    const body = new THREE.Mesh(new RoundedBoxGeometry(1.45, 1.0, 0.05, 4, 0.06), mat("#2c3036", { roughness: 0.25, metalness: 0.8 }));
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 0.91), new THREE.MeshBasicMaterial({ map: canvasTex(1360, 910, (x, w, h) => {
      const gr = x.createLinearGradient(0, 0, w, h);
      gr.addColorStop(0, "#1d3b8f"); gr.addColorStop(0.5, "#7b3fd1"); gr.addColorStop(1, "#ff7a59");
      x.fillStyle = gr; x.fillRect(0, 0, w, h);
      x.fillStyle = "rgba(255,255,255,.18)";
      for (let i = 0; i < 6; i++) { x.beginPath(); x.arc(w * (0.15 + i * 0.15), h * 0.62 + Math.sin(i) * 80, 160 - i * 12, 0, Math.PI * 2); x.fill(); }
      x.fillStyle = "#fff"; x.textAlign = "center"; x.font = "300 170px Jost, Arial"; x.fillText("10:09", w / 2, h * 0.36);
      x.font = "400 44px Jost, Arial"; x.fillText("Thursday, 25 December", w / 2, h * 0.46);
      x.font = "500 30px Jost, Arial"; x.globalAlpha = 0.7; x.fillText("SAMSUNG", w / 2, h * 0.95); x.globalAlpha = 1;
      x.fillStyle = "rgba(255,255,255,.85)";
      for (let i = 0; i < 6; i++) { x.beginPath(); x.roundRect(w * 0.22 + i * 140, h * 0.82, 96, 96, 24); x.fill(); }
    }) }));
    screen.position.z = 0.026;
    t.add(body, screen);
    t.rotation.x = -0.22;
    t.position.set(0, 0.56, 0);
    const stand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.04), mat("#8d96a3", { metalness: 1, roughness: 0.3 }));
    stand.rotation.x = 0.55; stand.position.set(0, 0.32, -0.25);
    g.add(t, stand);
    return g;
  },
  underwear() {
    const g = new THREE.Group();
    const cloth = mat("#141519", { roughness: 0.95 });
    const band = canvasTex(512, 64, (x, w, h) => { x.fillStyle = "#24262c"; x.fillRect(0, 0, w, h); x.fillStyle = "#c9ced6"; x.font = "600 30px Jost, Arial"; x.textAlign = "center"; x.fillText("·  BOXER  ·  BOXER  ·  BOXER  ·", w / 2, 43); });
    const bm = new THREE.MeshStandardMaterial({ map: band, roughness: 0.8 });
    // two folded boxers stacked
    for (let k = 0; k < 2; k++) {
      const b = new THREE.Mesh(new RoundedBoxGeometry(1.0, 0.16, 0.78, 4, 0.06), cloth);
      b.position.y = 0.08 + k * 0.17; b.rotation.y = k * 0.12 - 0.06;
      const wb = new THREE.Mesh(new RoundedBoxGeometry(1.0, 0.1, 0.12, 3, 0.04), [bm, bm, cloth, cloth, bm, bm]);
      wb.position.set(0, 0.09 + k * 0.17, 0.34); wb.rotation.y = b.rotation.y;
      g.add(b, wb);
    }
    // a pair of socks laid flat on top: leg, heel and foot along a curve
    const sockPath = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, -0.34), new THREE.Vector3(0, 0, 0.04), new THREE.Vector3(0.04, 0, 0.17), new THREE.Vector3(0.14, 0, 0.23), new THREE.Vector3(0.3, 0, 0.24)]);
    const sockGeo = new THREE.TubeGeometry(sockPath, 48, 0.085, 20, false);
    const toe = new THREE.SphereGeometry(0.085, 20, 14);
    const cuffGeo = new THREE.TorusGeometry(0.085, 0.018, 8, 24);
    for (const [x, ry] of [[-0.2, 0.15], [0.02, -0.05]]) {
      const sock = new THREE.Group();
      const sockM = mat("#26282f", { roughness: 0.85 });
      const leg = new THREE.Mesh(sockGeo, sockM);
      const tip = new THREE.Mesh(toe, sockM); tip.position.set(0.3, 0, 0.24);
      const cuff = new THREE.Mesh(cuffGeo, mat("#2a2c33", { roughness: 0.9 })); cuff.position.z = -0.34;

function loadImg(src) { return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
const PHOTOS = {};
await Promise.all(Object.entries(IMG).map(async ([k, v]) => { PHOTOS[k] = await loadImg(v); }));

function photoCard(im, height) {
  // a cut-out photo with real thickness: the front picture plus darker layers behind it
  const g = new THREE.Group();
  const tex = new THREE.Texture(im); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; tex.needsUpdate = true;
  const w = height * im.width / im.height;
  const geo = new THREE.PlaneGeometry(w, height);
  const front = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.45, toneMapped: false, side: THREE.FrontSide }));
  front.castShadow = true;
  g.add(front);
  const LAYERS = 10, DEPTH = 0.07;
  for (let i = 1; i <= LAYERS; i++) {
    const l = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.45, color: i === LAYERS ? 0x2a2e36 : 0x16181d, side: i === LAYERS ? THREE.DoubleSide : THREE.FrontSide }));
    l.position.z = -DEPTH * i / LAYERS;
    if (i === LAYERS) l.rotation.y = Math.PI, l.scale.x = -1;
    g.add(l);
  }
  g.position.y = height / 2;
  return g;
}

function photoTub(im) {
  // the tub photo wrapped round a real cylinder: undo the curve so the label reads correctly
  const g = new THREE.Group();
  const r = 0.38, h = 2 * r * im.height / im.width;
  const W = 1024, H = Math.round(W * im.height / im.width);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#121212"; x.fillRect(0, 0, W, H);
  for (let col = 0; col < W; col++) {
    const th = -Math.PI / 2 + Math.PI * (col + 0.5) / W;
    const sx = Math.min(im.width - 1, Math.max(0, (Math.sin(th) + 1) / 2 * im.width));
    x.drawImage(im, sx, 0, Math.max(1, im.width / W * Math.cos(th) * 1.6), im.height, col, 0, 1, H);
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const front = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 96, 1, true, -Math.PI / 2, Math.PI), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45, metalness: 0.1, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.35 }));
  const back = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 96, 1, true, Math.PI / 2, Math.PI), mat("#141414", { roughness: 0.4 }));
  const top = new THREE.Mesh(new THREE.CircleGeometry(r, 64), mat("#1a1a1a", { roughness: 0.35 }));
  top.rotation.x = -Math.PI / 2; top.position.y = h / 2;
  g.add(front, back, top);
  g.position.y = h / 2;
  return g;
}

function photoLaptop(lidIm, baseIm) {
  // real 3D laptop: keyboard photo on the base, screen photo on an opened lid
  const g = new THREE.Group();
  const tx = (im) => { const t = new THREE.Texture(im); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.needsUpdate = true; return t; };
  const shell = mat("#3a3d42", { roughness: 0.35, metalness: 0.7 });
  const W = 1.6, D = 1.05, T = 0.06;
  const top = new THREE.MeshBasicMaterial({ map: tx(baseIm), color: 0x8c8c8c, toneMapped: false });
  const base = new THREE.Mesh(new THREE.BoxGeometry(W, T, D), [shell, shell, top, shell, shell, shell]);
  base.position.y = T / 2;
  const lidW = W * 0.885, lidH = lidW * lidIm.height / lidIm.width;
  const hinge = new THREE.Group();
  hinge.position.set(0, T, -D / 2 + 0.03);
  hinge.rotation.x = -0.26; // opened a little past upright
  const lid = new THREE.Mesh(new THREE.BoxGeometry(lidW, lidH, 0.035), shell);
  lid.position.y = lidH / 2;
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(lidW * 0.995, lidH * 0.995), new THREE.MeshBasicMaterial({ map: tx(lidIm), toneMapped: false }));
  screen.position.set(0, lidH / 2, 0.0185);
  hinge.add(lid, screen);
  g.add(base, hinge);
  g.scale.setScalar(0.92);
  return g;
}

function photoBook(im, p) {
  // real 3D book: cover photo on the front, printed spine, cream page edges
  const H = 1.22, W = H * im.width / im.height, D = p.thick || 0.14;
  const sp = p.spine || { bg: "#222", fg: "#eee", title: p.name.toUpperCase(), author: "" };
  const tx = (src) => { const t = src instanceof HTMLCanvasElement ? new THREE.CanvasTexture(src) : new THREE.Texture(src); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.needsUpdate = true; return t; };
  const cover = new THREE.MeshBasicMaterial({ map: tx(im), color: 0xe6e6e6, toneMapped: false });
  const spineC = document.createElement("canvas"); spineC.width = 1100; spineC.height = Math.max(64, Math.round(1100 * D / H));
  { const x = spineC.getContext("2d"), w = spineC.width, h = spineC.height;
    x.fillStyle = sp.bg; x.fillRect(0, 0, w, h); x.fillStyle = sp.fg; x.textBaseline = "middle";
    x.font = `700 ${Math.round(h * 0.55)}px Georgia, serif`; x.fillText(sp.title, 50, h / 2);
    x.font = `500 ${Math.round(h * 0.3)}px Jost, Arial`; x.textAlign = "right"; x.globalAlpha = 0.8; x.fillText(sp.author, w - 50, h / 2); }
  const spineT = tx(spineC); spineT.center.set(0.5, 0.5); spineT.rotation = -Math.PI / 2;
  const spine = new THREE.MeshBasicMaterial({ map: spineT, color: 0xdddddd, toneMapped: false });
  const pagesC = document.createElement("canvas"); pagesC.width = 64; pagesC.height = 256;
  { const x = pagesC.getContext("2d"); x.fillStyle = "#efe8d8"; x.fillRect(0, 0, 64, 256); x.strokeStyle = "rgba(120,100,70,.18)"; for (let i = 0; i < 64; i += 3) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 256); x.stroke(); } }
  const pages = new THREE.MeshStandardMaterial({ map: tx(pagesC), roughness: 0.9 });
  const back = new THREE.MeshStandardMaterial({ color: sp.bg, roughness: 0.6 });
  const book = new THREE.Mesh(new RoundedBoxGeometry(W, H, D, 2, 0.008), [pages, spine, pages, pages, cover, back]);
  book.position.y = H / 2;
  book.rotation.y = 0.18;
  const g = new THREE.Group(); g.add(book);
  return g;
}

function buildModel(p) {
  if (p.model === "book" && PHOTOS[p.cover]) return photoBook(PHOTOS[p.cover], p);
  if (p.model === "laptop" && PHOTOS.laptop_lid && PHOTOS.laptop_base) return photoLaptop(PHOTOS.laptop_lid, PHOTOS.laptop_base);
  const im = PHOTOS[p.model];
  if (im && p.model === "protein") return photoTub(im);
  if (im) return photoCard(im, PHOTO_SIZE[p.model] || 1.2);
  return (MODELS[p.model] || MODELS.boardgame)();
}

/* ---------- carousel of podiums ---------- */
const N = PRODUCTS.length;
const R = Math.max(3.3, N * 0.56); // ring grows with more products
const carousel = new THREE.Group();
scene.add(carousel);
const podMat = [
  new THREE.MeshStandardMaterial({ color: "#0d1118", roughness: 0.28, metalness: 0.55 }),
  new THREE.MeshStandardMaterial({ color: "#2c3748", roughness: 0.7, metalness: 0.2 }),
  new THREE.MeshStandardMaterial({ color: "#0d1118" }),
];
const PRIO_H = [1.25, 1.14, 1.03, 0.93, 0.83, 0.74, 0.65, 0.57, 0.5]; // podium height for priority 1..9
const slots = PRODUCTS.map((p, i) => {
  const a = (i / N) * Math.PI * 2;
  const slot = new THREE.Group();
  slot.position.set(Math.sin(a) * R, 0, Math.cos(a) * R);
  slot.userData.index = i;
  const PR = N > 5 ? 0.86 : 1; // slimmer podiums when the ring is busy
  const pod = new THREE.Mesh(new THREE.CylinderGeometry(PR, PR, 1, 72), podMat);
  pod.castShadow = pod.receiveShadow = true;
  const edge = new THREE.Mesh(new THREE.TorusGeometry(PR, 0.008, 6, 96), new THREE.MeshBasicMaterial({ color: "#9fb6d6", transparent: true, opacity: 0.5 }));
  edge.rotation.x = Math.PI / 2;
  const holder = new THREE.Group();
  const model = shadows(buildModel(p));
  holder.add(model);
  const base = PRIO_H[Math.min(p.priority, PRIO_H.length) - 1] ?? 0.5;
  const plate = new THREE.Group();
  const num = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.36), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, map: canvasTex(310, 180, (x, w, h) => {
    x.textAlign = "center"; x.fillStyle = "rgba(255,255,255,.95)"; x.font = "italic 900 120px Jost, Arial"; x.fillText(String(p.priority).padStart(2, "0"), w / 2, 118);
    x.font = "500 22px Jost, Arial"; x.fillStyle = "rgba(200,220,255,.7)"; x.fillText("P R I O R I T Y", w / 2, 164);
  }) }));
  num.position.z = PR + 0.01;
  plate.add(num);
  slot.add(pod, edge, holder, plate);
  slot.userData = { index: i, pod, edge, holder, plate, num, base, h: base, angle: a, spin: Math.random() * 6 };
  carousel.add(slot);
  return slot;
});

/* ---------- snow ---------- */
const SNOW = 700;
const sp = new Float32Array(SNOW * 3);
for (let i = 0; i < SNOW; i++) { sp[i * 3] = (Math.random() - 0.5) * 26; sp[i * 3 + 1] = Math.random() * 12; sp[i * 3 + 2] = (Math.random() - 0.5) * 20 - 2; }
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute("position", new THREE.BufferAttribute(sp, 3));
const flake = canvasTex(64, 64, (x) => { const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); });
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ size: 0.07, map: flake, transparent: true, opacity: 0.7, depthWrite: false }));
scene.add(snow);

/* ---------- selection + UI ---------- */
let current = 0, rot = 0, targetRot = 0;
const $ = (id) => document.getElementById(id);
const dots = $("dots");
PRODUCTS.forEach((p, i) => { const b = document.createElement("button"); b.setAttribute("aria-label", p.name); b.onclick = () => select(i); dots.appendChild(b); });

function select(i) {
  i = ((i % N) + N) % N;
  const want = -(i / N) * Math.PI * 2;
  let d = want - targetRot;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  targetRot += d;
  if (i === current && $("name").textContent !== "—") return;
  current = i;
  const info = $("info"); info.classList.add("swap");
  setTimeout(() => {
    const p = PRODUCTS[i];
    $("idx").textContent = "PRIORITY " + String(p.priority).padStart(2, "0") + " / " + String(N).padStart(2, "0");
    $("name").textContent = p.name; $("desc").textContent = p.desc; $("link").href = p.url;
    [...dots.children].forEach((b, k) => b.classList.toggle("on", k === i));
    info.classList.remove("swap");
  }, 220);
}
$("prev").onclick = () => select(current - 1);
$("next").onclick = () => select(current + 1);
addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") select(current - 1); if (e.key === "ArrowRight") select(current + 1); });

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function hit(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const h = ray.intersectObjects(slots, true)[0];
  if (!h) return null;
  let o = h.object; while (o && !slots.includes(o)) o = o.parent;
  return o ? o.userData.index : null;
}
let downX = null, hovered = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downX = e.clientX; });
renderer.domElement.addEventListener("pointerup", (e) => {
  const dx = downX == null ? 0 : e.clientX - downX; downX = null;
  if (Math.abs(dx) > 40) { select(current + (dx < 0 ? 1 : -1)); return; }
  const i = hit(e); if (i != null) select(i);
});
renderer.domElement.addEventListener("pointermove", (e) => { if (e.pointerType !== "mouse") return; hovered = hit(e); renderer.domElement.style.cursor = hovered != null ? "pointer" : "default"; });

function frame() {
  const a = innerWidth / innerHeight;
  camera.aspect = a;
  const dist = a < 0.8 ? 15.5 / Math.max(a, 0.45) * 0.62 * (1 + (R - 3.3) * 0.06) : 14.2 + (R - 3.3) * 2.4;
  camera.position.set(0, a < 0.8 ? 4.4 : 3.0, dist);
  camera.lookAt(a < 0.8 ? new THREE.Vector3(0, 0.3, 0) : LOOK);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  mirror.getRenderTarget().setSize(innerWidth * 0.8, innerHeight * 0.8);
}
addEventListener("resize", frame);
frame();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  rot += (targetRot - rot) * (1 - Math.exp(-dt * 5));
  carousel.rotation.y = rot;
  slots.forEach((s, i) => {
    const u = s.userData, on = i === current, hov = i === hovered && !on;
    const h = u.base + (on ? 0.08 : hov ? 0.04 : 0);
    u.h += (h - u.h) * (1 - Math.exp(-dt * 6));
    u.pod.scale.y = u.h; u.pod.position.y = u.h / 2; u.edge.position.y = u.h + 0.001;
    u.plate.rotation.y = -rot; u.num.position.y = u.h / 2; u.edge.material.opacity = on ? 0.95 : 0.4;
    const sc = on ? 1.12 : 0.92;
    u.holder.scale.setScalar(u.holder.scale.x + (sc - u.holder.scale.x) * (1 - Math.exp(-dt * 6)));
    u.holder.position.y = u.h + 0.02 + (on ? Math.sin(t * 1.6) * 0.04 + 0.06 : 0);
    u.spin += dt * (on ? 0.55 : 0.18);
    // cancel the carousel rotation so every product faces the viewer, then sway gently
    u.holder.rotation.y = -rot + Math.sin(u.spin) * (PHOTOS[PRODUCTS[i].model] && PRODUCTS[i].model !== "protein" ? (on ? 0.5 : 0.25) : (on ? 0.9 : 0.35));
  });
  const p = snowGeo.attributes.position;
  for (let i = 0; i < SNOW; i++) { let y = p.getY(i) - dt * (0.25 + (i % 7) * 0.05); if (y < 0) y = 12; p.setY(i, y); p.setX(i, p.getX(i) + Math.sin(t * 0.5 + i) * dt * 0.08); }
  p.needsUpdate = true;
  renderer.render(scene, camera);
});

document.fonts.ready.then(() => {
  select(0);
  setTimeout(() => $("loader").classList.add("gone"), 200);
});
$("shipToggle").onclick = () => { const o = $("ship").classList.toggle("open"); $("shipToggle").setAttribute("aria-expanded", o); };
$("copyAddr").onclick = async () => {
  const txt = "Viale Monte Grappa, 3/5\nMilano, MI 20124\nItalia\n+393513858606";
  try { await navigator.clipboard.writeText(txt); } catch { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  const b = $("copyAddr"); b.textContent = "Copied ✓"; setTimeout(() => (b.textContent = "Copy address"), 1600);
};
window.__wish = { select, get current() { return current; } };
